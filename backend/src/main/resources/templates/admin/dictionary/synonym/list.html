<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Synonym 사전 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">검색 어드민</span>
        <div class="d-flex gap-4">
            <a class="text-white text-decoration-none fw-bold" th:href="@{/admin/dictionaries/synonyms}">Synonym 사전</a>
            <a class="text-white text-decoration-none" th:href="@{/admin/dictionaries/nori}">Nori 사전</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Synonym 사전</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">추가</button>
            <button class="btn btn-outline-warning btn-sm" onclick="reloadSynonyms()">Reload 실행</button>
        </div>
    </div>
    <div id="alert-area" class="mb-3"></div>
    <table class="table table-bordered table-sm">
        <thead class="table-light">
        <tr>
            <th style="width:50px">ID</th>
            <th>동의어 목록</th>
            <th>원본 문자열</th>
            <th style="width:70px">수정</th>
            <th style="width:70px">삭제</th>
        </tr>
        </thead>
        <tbody id="synonym-table-body"></tbody>
    </table>
</div>

<!-- 추가/수정 모달 -->
<div class="modal fade" id="synonymModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Synonym 추가</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">동의어 (쉼표로 구분)</label>
                <input type="text" class="form-control" id="synonym-raw-input"
                       placeholder="ci cd, cicd, continuous integration">
                <div class="form-text">term이 1개 이상이어야 합니다.</div>
                <input type="hidden" id="editing-id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveSynonym()">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadSynonyms);

    function loadSynonyms() {
        fetch('/api/admin/dictionaries/synonyms')
            .then(r => r.json())
            .then(renderTable)
            .catch(() => showAlert('목록 로드 실패', 'danger'));
    }

    function renderTable(entries) {
        const tbody = document.getElementById('synonym-table-body');
        if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">항목이 없습니다.</td></tr>';
            return;
        }
        tbody.innerHTML = entries.map(e => `
            <tr>
                <td>${e.id}</td>
                <td>${e.terms.join(' / ')}</td>
                <td><code>${e.raw}</code></td>
                <td><button class="btn btn-outline-secondary btn-sm" onclick="openEditModal(${e.id}, '${escapeHtml(e.raw)}')">수정</button></td>
                <td><button class="btn btn-outline-danger btn-sm" onclick="deleteSynonym(${e.id})">삭제</button></td>
            </tr>`).join('');
    }

    function openAddModal() {
        document.getElementById('modal-title').textContent = 'Synonym 추가';
        document.getElementById('synonym-raw-input').value = '';
        document.getElementById('editing-id').value = '';
        new bootstrap.Modal(document.getElementById('synonymModal')).show();
    }

    function openEditModal(id, raw) {
        document.getElementById('modal-title').textContent = 'Synonym 수정';
        document.getElementById('synonym-raw-input').value = raw;
        document.getElementById('editing-id').value = id;
        new bootstrap.Modal(document.getElementById('synonymModal')).show();
    }

    function saveSynonym() {
        const raw = document.getElementById('synonym-raw-input').value;
        const id = document.getElementById('editing-id').value;
        const terms = raw.split(',').map(t => t.trim()).filter(t => t);
        if (terms.length === 0) {
            showAlert('유효한 term을 입력해주세요.', 'warning');
            return;
        }
        const url = id ? `/api/admin/dictionaries/synonyms/${id}` : '/api/admin/dictionaries/synonyms';
        const method = id ? 'PUT' : 'POST';
        fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify({terms})})
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('synonymModal')).hide();
                loadSynonyms();
                showAlert('저장되었습니다.', 'success');
            })
            .catch(() => showAlert('저장에 실패했습니다.', 'danger'));
    }

    function deleteSynonym(id) {
        if (!confirm('삭제하시겠습니까?')) return;
        fetch(`/api/admin/dictionaries/synonyms/${id}`, {method: 'DELETE'})
            .then(r => { if (!r.ok) throw new Error(); })
            .then(() => { loadSynonyms(); showAlert('삭제되었습니다.', 'success'); })
            .catch(() => showAlert('삭제에 실패했습니다.', 'danger'));
    }

    function reloadSynonyms() {
        fetch('/api/admin/dictionaries/synonyms/reload', {method: 'POST'})
            .then(r => r.json())
            .then(data => showAlert(data.message, data.success ? 'success' : 'danger'))
            .catch(() => showAlert('Reload 요청 실패', 'danger'));
    }

    function showAlert(message, type) {
        const area = document.getElementById('alert-area');
        area.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
</body>
</html>
