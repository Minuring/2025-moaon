<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nori 사전 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">검색 어드민</span>
        <div class="d-flex gap-4">
            <a class="text-white text-decoration-none" th:href="@{/admin/dictionaries/synonyms}">Synonym 사전</a>
            <a class="text-white text-decoration-none fw-bold" th:href="@{/admin/dictionaries/nori}">Nori 사전</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Nori 사용자 사전</h4>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">추가</button>
    </div>
    <div id="reindex-status-banner" class="mb-3"></div>
    <div id="alert-area" class="mb-3"></div>
    <table class="table table-bordered table-sm">
        <thead class="table-light">
        <tr>
            <th style="width:50px">ID</th>
            <th>표면어</th>
            <th>분해 토큰</th>
            <th>원본 문자열</th>
            <th style="width:70px">수정</th>
            <th style="width:70px">삭제</th>
        </tr>
        </thead>
        <tbody id="nori-table-body"></tbody>
    </table>
</div>

<!-- 추가/수정 모달 -->
<div class="modal fade" id="noriModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Nori 항목 추가</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">표면어 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nori-surface-input" placeholder="세종시">
                </div>
                <div class="mb-3">
                    <label class="form-label">분해 토큰 (공백 구분, 선택)</label>
                    <input type="text" class="form-control" id="nori-segments-input" placeholder="세종 시">
                    <div class="form-text">없으면 비워두세요.</div>
                </div>
                <input type="hidden" id="editing-id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveNori()">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => { loadNori(); loadReindexStatus(); });

    function loadNori() {
        fetch('/api/admin/dictionaries/nori')
            .then(r => r.json())
            .then(renderTable)
            .catch(() => showAlert('목록 로드 실패', 'danger'));
    }

    function loadReindexStatus() {
        fetch('/api/admin/dictionaries/nori/reindex-status')
            .then(r => r.json())
            .then(data => {
                const banner = document.getElementById('reindex-status-banner');
                if (data.reindexRequired) {
                    banner.innerHTML = '<div class="alert alert-warning mb-0">변경 있음 — 다음 새벽 전체 재색인 시 반영됩니다.</div>';
                } else {
                    banner.innerHTML = '<div class="alert alert-success mb-0">변경 없음</div>';
                }
            })
        .catch(() => showAlert('재색인 상태 조회 실패', 'danger'));
    }

    function renderTable(entries) {
        const tbody = document.getElementById('nori-table-body');
        if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">항목이 없습니다.</td></tr>';
            return;
        }
        tbody.innerHTML = entries.map(e => `
            <tr>
                <td>${e.id}</td>
                <td>${e.surface}</td>
                <td>${e.segments.length > 0 ? e.segments.join(' / ') : '-'}</td>
                <td><code>${e.raw}</code></td>
                <td><button class="btn btn-outline-secondary btn-sm"
                    onclick="openEditModal(${e.id}, '${escapeHtml(e.surface)}', '${escapeHtml(e.segments.join(' '))}')">수정</button></td>
                <td><button class="btn btn-outline-danger btn-sm" onclick="deleteNori(${e.id})">삭제</button></td>
            </tr>`).join('');
    }

    function openAddModal() {
        document.getElementById('modal-title').textContent = 'Nori 항목 추가';
        document.getElementById('nori-surface-input').value = '';
        document.getElementById('nori-segments-input').value = '';
        document.getElementById('editing-id').value = '';
        new bootstrap.Modal(document.getElementById('noriModal')).show();
    }

    function openEditModal(id, surface, segmentsStr) {
        document.getElementById('modal-title').textContent = 'Nori 항목 수정';
        document.getElementById('nori-surface-input').value = surface;
        document.getElementById('nori-segments-input').value = segmentsStr;
        document.getElementById('editing-id').value = id;
        new bootstrap.Modal(document.getElementById('noriModal')).show();
    }

    function saveNori() {
        const surface = document.getElementById('nori-surface-input').value.trim();
        const segmentsStr = document.getElementById('nori-segments-input').value.trim();
        const id = document.getElementById('editing-id').value;
        if (!surface) { showAlert('표면어를 입력해주세요.', 'warning'); return; }
        const segments = segmentsStr ? segmentsStr.split(/\s+/).filter(s => s) : [];
        const url = id ? `/api/admin/dictionaries/nori/${id}` : '/api/admin/dictionaries/nori';
        const method = id ? 'PUT' : 'POST';
        fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify({surface, segments})})
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('noriModal')).hide();
                loadNori();
                loadReindexStatus();
                showAlert('저장되었습니다.', 'success');
            })
            .catch(() => showAlert('저장에 실패했습니다.', 'danger'));
    }

    function deleteNori(id) {
        if (!confirm('삭제하시겠습니까?')) return;
        fetch(`/api/admin/dictionaries/nori/${id}`, {method: 'DELETE'})
            .then(r => { if (!r.ok) throw new Error(); })
            .then(() => { loadNori(); loadReindexStatus(); showAlert('삭제되었습니다.', 'success'); })
            .catch(() => showAlert('삭제에 실패했습니다.', 'danger'));
    }

    function showAlert(message, type) {
        const area = document.getElementById('alert-area');
        area.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
</body>
</html>
