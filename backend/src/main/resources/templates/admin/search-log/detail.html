<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>검색 로그 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>검색 로그 상세</h2>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">어드민 홈</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-2">검색어</dt>
                <dd class="col-sm-10" th:text="${log.query}"></dd>
                <dt class="col-sm-2">결과수</dt>
                <dd class="col-sm-10" th:text="${log.resultCount}"></dd>
                <dt class="col-sm-2">2페이지 이상</dt>
                <dd class="col-sm-10" th:text="${log.hasCursor} ? '예' : '아니오'"></dd>
                <dt class="col-sm-2">동의어 매칭</dt>
                <dd class="col-sm-10">
                    <span th:if="${log.synonymMatchCount != null}" th:text="${log.synonymMatchCount} + '건'"></span>
                    <span th:if="${log.synonymMatchCount == null}" class="text-muted">-</span>
                </dd>
                <dt class="col-sm-2">응답시간</dt>
                <dd class="col-sm-10"><span th:text="${log.queryTimeMs}"></span> ms</dd>
                <dt class="col-sm-2">검색일시</dt>
                <dd class="col-sm-10" th:text="${#temporals.format(log.searchedAt, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </dl>
        </div>
    </div>

    <div class="card mb-4" th:if="${log.fieldMatchStats != null}">
        <div class="card-header">필드 매칭 분포</div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-2">집계 대상</dt>
                <dd class="col-sm-10" th:text="${log.fieldMatchStats.hitCount} + '건'"></dd>
                <dt class="col-sm-2">title 매칭</dt>
                <dd class="col-sm-10" th:text="${log.fieldMatchStats.titleCount} + '건'"></dd>
                <dt class="col-sm-2">summary 매칭</dt>
                <dd class="col-sm-10" th:text="${log.fieldMatchStats.summaryCount} + '건'"></dd>
                <dt class="col-sm-2">content only</dt>
                <dd class="col-sm-10" th:text="${log.fieldMatchStats.contentCount} + '건'"></dd>
            </dl>
        </div>
    </div>

    <h5>검색 결과 (상위 <span th:text="${log.hits.size()}"></span>건)</h5>
    <table class="table table-sm">
        <thead>
        <tr>
            <th>순위</th>
            <th>문서ID</th>
            <th>제목</th>
            <th>점수</th>
            <th>매칭 필드</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hit : ${log.hits}">
            <td th:text="${hit.rank}"></td>
            <td th:text="${hit.docId}"></td>
            <td th:text="${hit.title}"></td>
            <td th:text="${#numbers.formatDecimal(hit.score, 1, 2)}"></td>
            <td th:text="${#strings.listJoin(hit.matchedFields, ', ')}"></td>
        </tr>
        <tr th:if="${log.hits.isEmpty()}">
            <td colspan="5" class="text-center text-muted">검색 결과 없음</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
