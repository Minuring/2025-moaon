<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Case Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">검색 케이스 대시보드</h2>

    <!-- Status filter -->
    <form method="get" class="mb-3 d-flex gap-2">
        <select name="statusFilter" class="form-select w-auto">
            <option value="" th:selected="${statusFilter == null}">전체</option>
            <option th:each="s : ${reviewStatuses}"
                    th:value="${s.name()}"
                    th:text="${s.name()}"
                    th:selected="${s == statusFilter}">
            </option>
        </select>
        <button type="submit" class="btn btn-primary">필터</button>
    </form>

    <!-- Cases table -->
    <table class="table table-hover">
        <thead>
        <tr>
            <th>점수</th>
            <th>검색어</th>
            <th>결과수</th>
            <th>응답(ms)</th>
            <th>의심 플래그</th>
            <th>상태</th>
            <th>검색일시</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cases.content}">
            <td th:text="${c.badCaseScore}"></td>
            <td th:text="${c.query}"></td>
            <td th:text="${c.resultCount}"></td>
            <td th:text="${c.queryTimeMs}"></td>
            <td th:text="${#strings.listJoin(c.suspectFlags, ', ')}"></td>
            <td>
                <span class="badge"
                      th:classappend="${c.status.name() == 'BAD'} ? 'bg-danger' : (${c.status.name() == 'GOOD'} ? 'bg-success' : (${c.status.name() == 'SKIP'} ? 'bg-secondary' : 'bg-warning text-dark'))"
                      th:text="${c.status.name()}">
                </span>
            </td>
            <td th:text="${#temporals.format(c.searchedAt, 'MM-dd HH:mm')}"></td>
            <td><a th:href="@{/admin/search-cases/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">상세</a></td>
        </tr>
        <tr th:if="${cases.content.isEmpty()}">
            <td colspan="8" class="text-center text-muted">케이스가 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${cases.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <span class="page-link" th:if="${currentPage == 0}">이전</span>
                <a class="page-link" th:unless="${currentPage == 0}"
                   th:href="@{/admin/search-cases(page=${currentPage - 1}, statusFilter=${statusFilter})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, cases.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/search-cases(page=${i}, statusFilter=${statusFilter})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == cases.totalPages - 1} ? 'disabled'">
                <span class="page-link" th:if="${currentPage == cases.totalPages - 1}">다음</span>
                <a class="page-link" th:unless="${currentPage == cases.totalPages - 1}"
                   th:href="@{/admin/search-cases(page=${currentPage + 1}, statusFilter=${statusFilter})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
